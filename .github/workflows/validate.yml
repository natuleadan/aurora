name: validate

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-lint:
    name: Conventional Commits
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install commit tooling
        run: pnpm install --frozen-lockfile
      - name: Validate commit messages
        run: |
          for sha in $(git rev-list "origin/${{ github.base_ref }}..HEAD"); do
            subject=$(git log -1 --format='%s' "$sha")
            echo "$subject" | grep -qE '^Merge ' && continue
            case "$subject" in
              "chore(release):"*) echo "SKIP release commit $sha"; continue ;;
            esac
            author=$(git log -1 --format='%an' "$sha")
            case "$author" in
              *"[bot]"*) echo "SKIP bot commit $sha ($author)"; continue ;;
            esac
            git log -1 --format=%B "$sha" > /tmp/commit-msg.txt
            pnpm exec commitlint --edit /tmp/commit-msg.txt
          done

  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install native UI dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libgtk-4-dev libwebkitgtk-6.0-dev libglib2.0-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgdk-pixbuf-2.0-dev libcairo2-dev libpango1.0-dev \
            libatk1.0-dev libasound2-dev clang pkg-config

      - name: Install the UI engine
        env:
          NSH_VERSION: v0.5.1
        run: |
          curl -fsSL https://nsh.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run the full local suite
        run: pnpm validate
